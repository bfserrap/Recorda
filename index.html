function normalizarTelefono(telefono){
  let limpio = (telefono||"").replace(/[^\d+]/g,"");
  if(limpio.startsWith("+")) limpio = limpio.slice(1);
  if(limpio.startsWith("56")) return limpio;
  if(limpio.startsWith("9") && limpio.length===9) return "56"+limpio;
  return limpio;
}
function formatearFechaLarga(fecha){
  const [y,m,d] = fecha.split("-").map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function formatearHora(hora){
  const [h,m] = hora.split(":").map(Number);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function normalizarTextoPresentacion(valor){
  return String(valor || "").split("\n").map(linea=>{
    const limpio=linea.trim().replace(/\s+/g," ");
    if(!limpio) return "";
    return limpio.charAt(0).toLocaleUpperCase("es-CL")+limpio.slice(1).toLocaleLowerCase("es-CL");
  }).join("\n");
}

function construirMensaje(r){
  const tipo = TIPO_LABELS[r.tipo] || TIPO_LABELS.otro;
  const saludos = {
    cita_medica: "¡Hola! 👋 Este es tu recordatorio de salud 🔔",
    evento: "¡Hola! 👋 Tienes un evento próximo 🎉",
    tramite: "¡Hola! 👋 Tienes un trámite pendiente 📄",
    compra: "¡Hola! 👋 Esta es tu lista de compras 🛒",
    otro: "¡Hola! 👋 Tienes un recordatorio 🔔"
  };
  const partes = [saludos[r.tipo] || saludos.otro, "", `${tipo.emoji} *${tipo.label}*`];

  if(r.tipo !== "cita_medica" && r.tipo !== "compra") partes.push(`📌 *${normalizarTextoPresentacion(r.titulo)}*`);
  partes.push("", `📅 ${formatearFechaLarga(r.fecha)}`, `🕒 ${formatearHora(r.hora)} hrs`);

  if(r.tipo === "cita_medica"){
    if(r.centro_medico) partes.push(`🏥 ${normalizarTextoPresentacion(r.centro_medico)}`);
    if(r.especialidad) partes.push(`🩺 ${normalizarTextoPresentacion(r.especialidad)}`);
    if(r.medico) partes.push(`👩‍⚕️ ${normalizarTextoPresentacion(r.medico)}`);
    if(r.direccion) partes.push(`📍 ${normalizarTextoPresentacion(r.direccion)}`);
  } else if(r.tipo === "compra"){
    const items = (r.notas || "").split("\n").map(x=>x.trim()).filter(Boolean);
    if(items.length){
      partes.push("", "🧺 *Tu lista:*", ...items.map(item=>`- ${normalizarTextoPresentacion(item.replace(/^[-•☐▪▫️]\s*/,""))}`));
    }
  } else {
    if(r.ubicacion) partes.push(`📍 ${normalizarTextoPresentacion(r.ubicacion)}`);
    if(r.tipo === "evento" && r.notas?.startsWith("Llevar:")){
      const [llevar, ...resto] = r.notas.split("\n\n");
      partes.push("", `🎒 *Para llevar:* ${normalizarTextoPresentacion(llevar.replace(/^Llevar:\s*/,""))}`);
      if(resto.join("\n\n").trim()) partes.push(`📝 ${normalizarTextoPresentacion(resto.join("\n\n"))}`);
    } else if(r.notas){
      partes.push("", `📝 ${normalizarTextoPresentacion(r.notas)}`);
    }
  }

  if(r.tipo === "cita_medica" && r.notas) partes.push("", `📝 ${normalizarTextoPresentacion(r.notas)}`);
  return partes.join("\n");
}


function linkWhatsApp(r){
  const mensaje = encodeURIComponent(construirMensaje(r));
  const telefono = r.telefono_whatsapp ? normalizarTelefono(r.telefono_whatsapp) : "";
  return `https://wa.me/${telefono}?text=${mensaje}`;
}
function diasRestantes(fecha,hora){
  const objetivo = new Date(`${fecha}T${hora}`);
  const diffMs = objetivo.getTime() - Date.now();
  const diffHoras = diffMs/1000/60/60;
  if(diffMs<0) return {texto:"Ya pasó",urgente:false,pasado:true};
  if(diffHoras<1) return {texto:"¡Es en menos de 1 hora!",urgente:true,pasado:false};
  if(diffHoras<24) return {texto:`En ${Math.round(diffHoras)} horas`,urgente:true,pasado:false};
  const dias = Math.round(diffHoras/24);
  return {texto:`En ${dias} día${dias===1?"":"s"}`,urgente:dias<=2,pasado:false};
}
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   5) RENDER PRINCIPAL
   ============================================================ */
async function render(){
  const hash = window.location.hash.replace("#","") || (STATE.user ? "dashboard" : "landing");

  const rutasProtegidas = ["dashboard", "nuevo", "editar/", "perfil"];
  const requiereLogin = rutasProtegidas.some(r => hash===r || hash.startsWith(r));
  if(!STATE.user && requiereLogin){ navigate("login"); return; }
  if(STATE.user && (hash==="landing" || hash==="login")){ navigate("dashboard"); return; }

  const app = document.getElementById("app");

  if(hash==="landing") { app.innerHTML = viewLanding(); bindLanding(); return; }
  if(hash==="login") { app.innerHTML = viewLogin(); bindLogin(); return; }
  if(hash==="dashboard") { app.innerHTML = viewDashboardLoading(); await loadReminders(); app.innerHTML = viewDashboard(); bindDashboard(); return; }
  if(hash==="nuevo") { await asegurarPerfilCargado(); STATE.editId=null; STATE.formTempTipo="cita_medica"; STATE.formManualCentro=false; app.innerHTML = viewForm(null); bindForm(); return; }
  if(hash.startsWith("editar/")) {
    await asegurarPerfilCargado();
    const id = hash.split("/")[1];
    await loadReminders();
    const r = STATE.reminders.find(x=>x.id===id);
    STATE.editId = id;
    STATE.formTempTipo = r?.tipo || "cita_medica";
    STATE.formManualCentro = !!r?.centro_medico && !CENTROS_MEDICOS_CHILE.some(reg=>reg.centros.some(c=>c.nombre===r.centro_medico));
    app.innerHTML = viewForm(r);
    bindForm();
    return;
  }
  if(hash==="perfil") { app.innerHTML = viewPerfilLoading(); await bindPerfilLoad(); return; }

  navigate(STATE.user ? "dashboard" : "landing");
}

function bindLogin(){
  let modo = "login";
  const $ = id => document.getElementById(id);
  function setModo(m){
    modo = m;
    $("modo-login").className = "flex-1 rounded-full py-2 font-medium transition " + (m==="login" ? "bg-mint-500 text-ink-950" : "text-sand/60");
    $("modo-registro").className = "flex-1 rounded-full py-2 font-medium transition " + (m==="registro" ? "bg-mint-500 text-ink-950" : "text-sand/60");
    $("campo-nombre").classList.toggle("hidden", m!=="registro");
    $("login-titulo").textContent = m==="login" ? "Bienvenido de vuelta" : "Crea tu cuenta gratis";
    $("login-subtitulo").textContent = m==="login" ? "Ingresa para ver tus recordatorios" : "Toma menos de un minuto";
    $("auth-submit").textContent = m==="login" ? "Iniciar sesión →" : "Crear cuenta →";
    $("auth-error").classList.add("hidden"); $("auth-aviso").classList.add("hidden");
  }
  $("modo-login").onclick = ()=>setModo("login");
  $("modo-registro").onclick = ()=>setModo("registro");

  $("auth-form").onsubmit = async (e)=>{
    e.preventDefault();
    const email = $("in-email").value.trim();
    const password = $("in-password").value;
    const nombre = $("in-nombre").value.trim();
    $("auth-error").classList.add("hidden"); $("auth-aviso").classList.add("hidden");
    $("auth-submit").disabled = true;
    $("auth-submit").textContent = "Un momento...";
    try{
      if(modo==="registro"){
        const { error } = await sb.auth.signUp({ email, password, options:{ data:{ nombre } } });
        if(error) throw error;
        $("auth-aviso").textContent = "¡Cuenta creada! Revisa tu correo si te pedimos confirmarlo, o inicia sesión directamente. 🎉";
        $("auth-aviso").classList.remove("hidden");
        setModo("login");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        navigate("dashboard");
      }
    } catch(err){
      $("auth-error").textContent = "⚠️ " + traducirError(err?.message);
      $("auth-error").classList.remove("hidden");
    } finally {
      $("auth-submit").disabled = false;
      $("auth-submit").textContent = modo==="login" ? "Iniciar sesión →" : "Crear cuenta →";
    }
  };
}
function traducirError(msg){
  if(!msg) return "Ocurrió un error. Intenta de nuevo.";
  if(msg.includes("Invalid login credentials")) return "Correo o contraseña incorrectos.";
  if(msg.includes("User already registered")) return "Ese correo ya tiene una cuenta. Intenta iniciar sesión.";
  if(msg.includes("Password should be at least")) return "La contraseña debe tener al menos 6 caracteres.";
  return msg;
}

      </form>

function bindForm(){
  const $ = id => document.getElementById(id);
  const normalizarTexto = valor => String(valor || "").split("\n").map(linea=>{
    const limpio=linea.trim().replace(/\s+/g," ");
    if(!limpio) return "";
    return limpio.charAt(0).toLocaleUpperCase("es-CL")+limpio.slice(1).toLocaleLowerCase("es-CL");
  }).join("\n");
  const recordatorioEditado = STATE.editId ? STATE.reminders.find(r=>r.id===STATE.editId) : null;
  const estadoAvisosEditado = String(recordatorioEditado?.region || "").startsWith("__avisos:") ? (()=>{try{return JSON.parse(String(recordatorioEditado.region).slice(9));}catch{return null;}})() : null;
  const avisosIniciales = estadoAvisosEditado?.todos?.length ? estadoAvisosEditado.todos.map(Number) : [Number(recordatorioEditado?.anticipacion_horas ?? 24)];
  const anticipaciones = new Set(avisosIniciales.filter(h=>ANTICIPACION_OPCIONES.some(o=>o.valor===h)));
  let anticipacionPersonalizada = avisosIniciales.find(h=>!ANTICIPACION_OPCIONES.some(o=>o.valor===h));
  let compraModo = STATE.editId ? "programada" : "ahora";

  if(STATE.editId){
    const r = STATE.reminders.find(x=>x.id===STATE.editId);
    if(r && anticipacionPersonalizada!==undefined){
      const fechaCita = new Date(`${r.fecha}T${r.hora}`);
      fechaCita.setHours(fechaCita.getHours() - anticipacionPersonalizada);
      setTimeout(()=>{
        if($("f-fecha-aviso")) $("f-fecha-aviso").value = fechaCita.toISOString().split("T")[0];
        if($("f-hora-aviso")) $("f-hora-aviso").value = fechaCita.toTimeString().slice(0,5);
      },50);
    }
  }

  function renderSugerencias(config){
    const contenedor = $("sugerencias-titulo");
    contenedor.innerHTML = (config.sugerencias||[]).map(s=>`<button type="button" class="chip !px-3 !py-1.5" data-sugerencia="${esc(s)}">${esc(s)}</button>`).join("");
    contenedor.querySelectorAll("button").forEach(b=>b.onclick=()=>{$("f-titulo").value=b.dataset.sugerencia;});
  }

  function actualizarTipo(){
    const tipo = STATE.formTempTipo;
    const config = FORM_CONFIG[tipo] || FORM_CONFIG.otro;
    const esCita = tipo === "cita_medica";
    const esCompra = tipo === "compra";
    $("bloque-titulo").classList.toggle("hidden", esCita || esCompra);
    $("bloque-cita").classList.toggle("hidden", !esCita);
    $("bloque-compra").classList.toggle("hidden", !esCompra);
    $("bloque-evento").classList.toggle("hidden", tipo !== "evento");
    $("bloque-ubicacion").classList.toggle("hidden", esCita || esCompra);
    $("bloque-notas").classList.toggle("hidden", esCompra);
    $("bloque-anticipacion").classList.toggle("hidden", esCompra);
    $("label-titulo").textContent = config.titulo;
    $("f-titulo").placeholder = config.placeholder;
    $("label-ubicacion").textContent = config.ubicacion;
    $("f-ubicacion").placeholder = config.ubicacionPlaceholder;
    $("f-notas").placeholder = config.notasPlaceholder;
    renderSugerencias(config);
    actualizarModoCompra();
  }

  function actualizarModoCompra(){
    const esCompra = STATE.formTempTipo === "compra";
    $("bloque-fecha-hora").classList.toggle("hidden", esCompra && compraModo === "ahora");
    if(esCompra){
      $("label-fecha").textContent = "Fecha de envío";
      $("label-hora").textContent = "Hora de envío";
      $("f-avisar-whatsapp").checked = true;
      $("f-avisar-whatsapp").disabled = true;
      $("campo-telefono").classList.remove("hidden");
    } else {
      $("label-fecha").textContent = "Fecha";
      $("label-hora").textContent = "Hora";
      $("f-avisar-whatsapp").disabled = false;
    }
  }

  function prepararFilaProducto(fila){
    const campo=fila.querySelector(".f-producto");
    campo.onblur=()=>{campo.value=normalizarTexto(campo.value);};
    const boton=fila.querySelector(".btn-eliminar-producto");
    if(boton) boton.onclick=()=>{
      const filas=document.querySelectorAll("#lista-compra-items .compra-item");
      if(filas.length===1){
        fila.querySelector(".f-producto").value="";
        fila.querySelector(".f-producto").focus();
      } else fila.remove();
    };
  }

  function agregarProducto(){
    const fila=document.createElement("div");
    fila.className="compra-item flex items-center gap-2";
    fila.innerHTML='<input class="input-field f-producto" placeholder="Ej: Leche" /><button type="button" class="btn-eliminar-producto btn-ghost !px-3 !py-2 text-lg" aria-label="Eliminar producto">×</button>';
    $("lista-compra-items").appendChild(fila);
    prepararFilaProducto(fila);
    fila.querySelector(".f-producto").focus();
  }

  document.querySelectorAll("#lista-compra-items .compra-item").forEach(prepararFilaProducto);
  ["f-titulo","f-centro-manual","f-especialidad-manual","f-medico","f-direccion","f-ubicacion","f-llevar","f-notas","p-nombre"].forEach(id=>{
    const campo=$(id);
    if(campo) campo.onblur=()=>{campo.value=normalizarTexto(campo.value);};
  });
  $("btn-agregar-producto").onclick=agregarProducto;
  $("lista-compra-items").onkeydown=e=>{
    if(e.key==="Enter"&&e.target.classList.contains("f-producto")){
      e.preventDefault();
      agregarProducto();
    }
  };

  document.querySelectorAll("#tipo-chips button").forEach(b=>{
    b.onclick=()=>{
      STATE.formTempTipo=b.dataset.tipo;
      document.querySelectorAll("#tipo-chips button").forEach(x=>x.className="chip"+(x===b?" chip-active":""));
      actualizarTipo();
    };
  });

  document.querySelectorAll("#compra-modo-chips button").forEach(b=>{
    b.onclick=()=>{
      compraModo=b.dataset.compraModo;
      document.querySelectorAll("#compra-modo-chips button").forEach(x=>x.className="chip"+(x===b?" chip-active":""));
      actualizarModoCompra();
    };
  });

  $("f-especialidad").onchange=()=>$("bloque-otra-especialidad").classList.toggle("hidden", $("f-especialidad").value!=="otra");

  function toggleCanal(){
    const checked=$("f-avisar-whatsapp").checked;
    $("wrap-whatsapp").classList.toggle("border-mint-500/60",checked);
    $("wrap-whatsapp").classList.toggle("bg-mint-500/10",checked);
    $("campo-telefono").classList.toggle("hidden",!checked);
  }
  $("f-avisar-whatsapp").onchange=toggleCanal;

  document.querySelectorAll("#anticipacion-chips button").forEach(b=>{
    b.onclick=()=>{
      if(b.id==="btn-ant-personalizada"){
        const activar=!b.classList.contains("chip-active");
        b.classList.toggle("chip-active",activar);
        $("bloque-fecha-manual").classList.toggle("hidden",!activar);
        if(!activar) anticipacionPersonalizada=undefined;
      } else {
        const horas=Number(b.dataset.ant);
        if(anticipaciones.has(horas)) anticipaciones.delete(horas); else anticipaciones.add(horas);
        b.classList.toggle("chip-active",anticipaciones.has(horas));
      }
    };
  });

  actualizarTipo();

  $("reminder-form").onsubmit=async(e)=>{
    e.preventDefault();
    $("form-error").classList.add("hidden");
    const mostrarError=msg=>{$("form-error").textContent="⚠️ "+msg;$("form-error").classList.remove("hidden");};

    if(!STATE.user){
      const {data}=await sb.auth.getSession();
      STATE.user=data.session?.user||null;
    }
    if(!STATE.user){mostrarError("Tu sesión se cerró. Vuelve a iniciar sesión.");return;}

    const tipo=STATE.formTempTipo;
    const esCompra=tipo==="compra";
    const esCita=tipo==="cita_medica";
    let fecha=$("f-fecha").value;
    let hora=$("f-hora").value;

    if(esCompra && compraModo==="ahora"){
      const ahora=new Date();
      fecha=`${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,"0")}-${String(ahora.getDate()).padStart(2,"0")}`;
      hora=`${String(ahora.getHours()).padStart(2,"0")}:${String(ahora.getMinutes()).padStart(2,"0")}`;
    }

    const especialidad=normalizarTexto($("f-especialidad").value==="otra" ? $("f-especialidad-manual").value : $("f-especialidad").value);
    const centro=normalizarTexto($("f-centro-manual").value);
    const listaCompra=[...document.querySelectorAll(".f-producto")].map(x=>normalizarTexto(x.value)).filter(Boolean).join("\n");
    let titulo=esCita ? (especialidad?`Cita médica · ${especialidad}`:"Cita médica") : (esCompra?"🛒 Lista de compras":normalizarTexto($("f-titulo").value));

    if(!fecha||!hora){mostrarError(esCompra?"Elige cuándo enviar la lista.":"Completa la fecha y la hora.");return;}
    if(!esCita&&!esCompra&&!titulo){mostrarError("Escribe un título para el recordatorio.");return;}
    if(esCita&&(!centro||!especialidad)){mostrarError("Completa el centro médico y la especialidad.");return;}
    if(esCompra&&!listaCompra){mostrarError("Agrega al menos un producto a la lista.");return;}

    const telefono=$("f-telefono").value.trim();
    const avisarWhatsapp=esCompra?true:$("f-avisar-whatsapp").checked;
    if(avisarWhatsapp&&!telefono){mostrarError("Ingresa tu número de WhatsApp.");return;}

    let horasAvisos=esCompra?[0]:[...anticipaciones];
    if(!esCompra&&$("btn-ant-personalizada").classList.contains("chip-active")){
      if(!$("f-fecha-aviso").value||!$("f-hora-aviso").value){mostrarError("Completa la fecha y hora exacta del aviso.");return;}
      const fechaCita=new Date(`${fecha}T${hora}`);
      const fechaAviso=new Date(`${$("f-fecha-aviso").value}T${$("f-hora-aviso").value}`);
      const diffMs=fechaCita.getTime()-fechaAviso.getTime();
      if(diffMs<0){mostrarError("El aviso no puede quedar después del recordatorio.");return;}
      anticipacionPersonalizada=Math.max(0,Math.round(diffMs/(1000*60*60)));
      horasAvisos.push(anticipacionPersonalizada);
    }
    horasAvisos=[...new Set(horasAvisos.map(Number))].sort((a,b)=>b-a);
    if(!esCompra&&!horasAvisos.length){mostrarError("Selecciona al menos un momento para recibir el aviso.");return;}
    const horasCalculadas=Math.max(...horasAvisos);

    let notas=normalizarTexto($("f-notas").value)||null;
    if(tipo==="evento"&&$("f-llevar").value.trim()) notas=`Llevar: ${normalizarTexto($("f-llevar").value)}${notas?`\n\n${notas}`:""}`;
    if(esCompra) notas=listaCompra;

    const payload={
      user_id:STATE.user.id,
      tipo:esCompra?"otro":tipo,
      titulo,fecha,hora,
      centro_medico:esCita?centro:null,
      region:null,
      especialidad:esCita?especialidad:null,
      medico:esCita?(normalizarTexto($("f-medico").value)||null):null,
      numero_ficha:null,
      direccion:esCita?(normalizarTexto($("f-direccion").value)||null):null,
      ubicacion:(!esCita&&!esCompra)?(normalizarTexto($("f-ubicacion").value)||null):null,
      notas,
      avisar_email:false,
      avisar_whatsapp:avisarWhatsapp,
      email_aviso:null,
      telefono_whatsapp:avisarWhatsapp?telefono:null,
      anticipacion_horas:horasCalculadas,
      notificado:false
    };
    payload.region=`__avisos:${JSON.stringify({todos:horasAvisos,enviados:[]})}`;

    $("form-submit").disabled=true;
    $("form-submit").textContent="Guardando…";
    try{
      const consulta=STATE.editId?sb.from("reminders").update(payload).eq("id",STATE.editId):sb.from("reminders").insert(payload);
      const {error}=await consulta;
      if(error) throw error;
      if(avisarWhatsapp&&telefono) await sb.from("profiles").upsert({id:STATE.user.id,telefono_whatsapp:telefono});
      navigate("dashboard");
    }catch(err){
      mostrarError(err?.message||"No se pudo guardar el recordatorio.");
    }finally{
      $("form-submit").disabled=false;
      $("form-submit").textContent=STATE.editId?"Guardar cambios ✅":"Crear recordatorio 🔔";
    }
  };
}

            <label class="label-field">Número de WhatsApp por defecto</label>
            <input id="p-telefono" class="input-field" placeholder="Ej: +56 9 1234 5678" value="${esc(perfil?.telefono_whatsapp)}" />
            <p class="mt-1 text-xs text-sand/40">Se usará como valor por defecto al crear nuevos recordatorios.</p>
          </div>
<div>
            <label class="label-field">API Key de CallMeBot</label>
            <input id="p-callmebot" class="input-field" placeholder="Ej: 123456" value="${esc(perfil?.callmebot_apikey)}" />
            <div class="mt-3 rounded-xl border border-mint-500/30 bg-mint-500/5 p-4 text-xs text-sand/70 space-y-2">
              <p class="font-semibold text-sand">📲 Cómo activar tu WhatsApp (una sola vez):</p>
              <ol class="list-decimal list-inside space-y-1">
                <li>Toca el botón de abajo — abre WhatsApp con el mensaje ya escrito</li>
                <li>Solo aprieta "Enviar" en WhatsApp</li>
                <li>El bot te responde con un mensaje largo — busca la línea que dice <b>"Your apikey is:"</b> y copia SOLO el número que viene justo después (ignora todo el resto del mensaje)</li>
                <li>Pega ese número arriba, en el campo "API Key de CallMeBot", y guarda cambios</li>
              </ol>
              <div class="mt-2 rounded-lg bg-white border border-mint-500/20 p-3">
                <p class="text-[11px] text-sand/50 mb-1">Ejemplo de lo que responde el bot:</p>
                <p class="text-xs font-mono text-sand/70">CallMeBot API Activated for 569XXXXXXXX<br/>Your apikey is: <span class="bg-mint-500/20 text-mint-600 font-bold px-1 rounded">9994056</span> ← <b>esto es lo único que copias</b></p>
              </div>
              <a href="https://wa.me/34611011637?text=I%20allow%20callmebot%20to%20send%20me%20messages" target="_blank" rel="noopener noreferrer" class="btn-primary !mt-2 w-full !py-2 text-sm">📲 Abrir WhatsApp y activar</a>
            </div>
          </div>
          <div id="perfil-aviso" class="hidden rounded-xl bg-mint-500/10 px-4 py-3 text-sm text-mint-400"></div>
          <button type="submit" id="perfil-submit" class="btn-primary w-full">Guardar cambios</button>
        </form>
      </div>
      <button id="perfil-logout" class="btn-secondary mt-6 w-full text-coral-400">Cerrar sesión</button>
    </div>
    ${bottomNav("perfil")}
  </main>`;

  document.getElementById("perfil-form").onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById("perfil-submit");
    btn.disabled = true; btn.textContent = "Guardando...";
const { error: guardarError } = await sb.from("profiles").upsert({
      id: STATE.user.id,
      nombre: normalizarTextoPresentacion(document.getElementById("p-nombre").value),
      telefono_whatsapp: document.getElementById("p-telefono").value,
      callmebot_apikey: document.getElementById("p-callmebot").value
    });
    const aviso = document.getElementById("perfil-aviso");
    aviso.classList.remove("hidden");
    if(guardarError){
      console.error("Error guardando perfil:", guardarError);
      aviso.className = "rounded-xl bg-red-500/10 px-4 py-3 text-sm text-red-300";
      aviso.textContent = "⚠️ No se pudo guardar: " + guardarError.message;
    } else {
      STATE.perfil = {
        nombre: normalizarTextoPresentacion(document.getElementById("p-nombre").value),
        telefono_whatsapp: document.getElementById("p-telefono").value,
        callmebot_apikey: document.getElementById("p-callmebot").value
      };
      aviso.className = "rounded-xl bg-mint-500/10 px-4 py-3 text-sm text-mint-400";
      aviso.textContent = "Datos guardados ✅";
    }
    btn.disabled = false; btn.textContent = "Guardar cambios";
  };
  document.getElementById("perfil-logout").onclick = async ()=>{ await sb.auth.signOut(); STATE.perfil=null; navigate("landing"); };
}
</script>
</body>
</html>
