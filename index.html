/* ============================================================

const ESPECIALIDADES_MEDICAS = [

  tramite:{titulo:"¿Qué trámite debes realizar?",placeholder:"Ej: Renovar licencia",ubicacion:"Lugar o institución (opcional)",ubicacionPlaceholder:"Ej: Municipalidad, Registro Civil",notasPlaceholder:"Documentos necesarios",sugerencias:["Renovar licencia","Pagar permiso","Hora Registro Civil"]},

/* ============================================================
   4) UTILIDADES Y GREEN.API WHATSAPP INTEGRATION
   ============================================================ */
function normalizarTelefono(telefono){
  let limpio = (telefono||"").replace(/[^\d+]/g,"");
  if(limpio.startsWith("+")) limpio = limpio.slice(1);
  if(limpio.startsWith("56")) return limpio;
  if(limpio.startsWith("9") && limpio.length===9) return "56"+limpio;
  return limpio;
}

async function enviarWhatsAppGreenAPI(telefono, mensaje){
  const limpio = normalizarTelefono(telefono);
  if(!limpio) throw new Error("Número de teléfono inválido");
  const chatId = limpio + "@c.us";
  const url = `${GREEN_API_URL}/waInstance${GREEN_API_ID_INSTANCE}/sendMessage/${GREEN_API_TOKEN_INSTANCE}`;
  
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chatId, message: mensaje })
  });
  
  const data = await response.json();
  if(!response.ok){
    throw new Error(data.message || "Error al enviar mensaje por Green.API");
  }
  return data;
}

function formatearFechaLarga(fecha){
  if(!fecha) return "";
  const [y,m,d] = fecha.split("-").map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function formatearHora(hora){
  if(!hora) return "";
  const [h,m] = hora.split(":").map(Number);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function normalizarTextoPresentacion(valor){
  return String(valor || "").split("\n").map(linea=>{
    const limpio=linea.trim().replace(/\s+/g," ");
    if(!limpio) return "";
    return limpio.charAt(0).toLocaleUpperCase("es-CL")+limpio.slice(1).toLocaleLowerCase("es-CL");
  }).join("\n");
}

function contactosWhatsApp(perfil = STATE.perfil){
  const bruto = perfil?.telefono_whatsapp;
  try {
    const contactos = JSON.parse(bruto || "[]");
    if(Array.isArray(contactos)) return contactos.filter(c=>c && c.id && c.telefono)
      .map(c=>({id:String(c.id),nombre:c.nombre||"WhatsApp",telefono:c.telefono,activo:c.activo!==false}));
  } catch(_) {}
  return bruto ? [{id:"principal",nombre:"Mi WhatsApp",telefono:bruto,activo:true}] : [];
}
function destinatariosRecordatorio(recordatorio, contactos = contactosWhatsApp()){
  const bruto = recordatorio?.telefono_whatsapp || "";
  try {
    const ids = JSON.parse(bruto);
    if(Array.isArray(ids)) return contactos.filter(c=>ids.includes(c.id));
  } catch(_) {}
  return bruto ? contactos.filter(c=>normalizarTelefono(c.telefono)===normalizarTelefono(bruto)) : [];
}

function parseAnticipaciones(val){
  if(!val && val !== 0) return [{tipo:'preset', valor:24}];
  if(typeof val === 'number') return [{tipo:'preset', valor: val}];
  try {
    const parsed = typeof val === 'string' ? JSON.parse(val) : val;
    if(Array.isArray(parsed)) return parsed;
  } catch(_) {}
  return [{tipo:'preset', valor: Number(val) || 24}];
}

function formatAnticipaciones(anticipacionVal){
  const items = parseAnticipaciones(anticipacionVal);
  return items.map(item => {
    if(item.tipo === 'preset'){
      if(item.valor === 6) return '6 horas antes';
      if(item.valor === 24) return '1 día antes';
      if(item.valor === 72) return '3 días antes';
      if(item.valor === 168) return '1 semana antes';
      return `${item.valor}h antes`;
    } else if(item.tipo === 'custom'){
      return `Personalizado: ${item.fecha || ''} ${item.hora || ''}`.trim();
    }
    return '';
  }).filter(Boolean).join(' · ');
}

function construirMensaje(r){
  const tipo = TIPO_LABELS[r.tipo] || TIPO_LABELS.otro;
  const saludos = {
    cita_medica: "¡Hola! 👋 Este es tu recordatorio de salud 🔔",
    evento: "¡Hola! 👋 Tienes un evento próximo 🎉",
    tramite: "¡Hola! 👋 Tienes un trámite pendiente 📄",
    compra: "¡Hola! 👋 Esta es tu lista de compras 🛒",
    otro: "¡Hola! 👋 Tienes un recordatorio 🔔"
  };
  const partes = [saludos[r.tipo] || saludos.otro, "", `${tipo.emoji} *${tipo.label}*`];

  if(r.tipo !== "cita_medica" && r.tipo !== "compra") partes.push(`📌 *${normalizarTextoPresentacion(r.titulo)}*`);
  partes.push("", `📅 ${formatearFechaLarga(r.fecha)}`, `🕒 ${formatearHora(r.hora)} hrs`);

  if(r.tipo === "cita_medica"){
    if(r.centro_medico) partes.push(`🏥 ${normalizarTextoPresentacion(r.centro_medico)}`);
    if(r.especialidad) partes.push(`🩺 ${normalizarTextoPresentacion(r.especialidad)}`);
    if(r.medico) partes.push(`👩‍⚕️ ${normalizarTextoPresentacion(r.medico)}`);
    if(r.direccion) partes.push(`📍 ${normalizarTextoPresentacion(r.direccion)}`);
  } else if(r.tipo === "compra"){
    const items = (r.notas || "").split("\n").map(x=>x.trim()).filter(Boolean);
    if(items.length){
      partes.push("", "🧺 *Tu lista:*", ...items.map(item=>`- ${normalizarTextoPresentacion(item.replace(/^[-•☐▪▫️]\s*/,""))}`));
    }
  } else {
    if(r.ubicacion) partes.push(`📍 ${normalizarTextoPresentacion(r.ubicacion)}`);
    if(r.notas) partes.push("", `📝 ${normalizarTextoPresentacion(r.notas)}`);
  }

  if(r.tipo === "cita_medica" && r.notas) partes.push("", `📝 ${normalizarTextoPresentacion(r.notas)}`);
  return partes.join("\n");
}

function diasRestantes(fecha,hora){
  const objetivo = new Date(`${fecha}T${hora}`);
  const diffMs = objetivo.getTime() - Date.now();
  const diffHoras = diffMs/1000/60/60;
  if(diffMs<0) return {texto:"Ya pasó",urgente:false,pasado:true};
  if(diffHoras<1) return {texto:"¡Es en menos de 1 hora!",urgente:true,pasado:false};
  if(diffHoras<24) return {texto:`En ${Math.round(diffHoras)} horas`,urgente:true,pasado:false};
  const dias = Math.round(diffHoras/24);
  return {texto:`En ${dias} día${dias===1?"":"s"}`,urgente:dias<=2,pasado:false};
}
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   5) RENDER PRINCIPAL Y RUTAS
   ============================================================ */
async function render(){
  const hash = window.location.hash.replace("#","") || (STATE.user ? "dashboard" : "landing");
  const rutasProtegidas = ["dashboard", "nuevo", "editar/", "perfil"];
  const requiereLogin = rutasProtegidas.some(r => hash===r || hash.startsWith(r));
  if(!STATE.user && requiereLogin){ navigate("login"); return; }
  if(STATE.user && (hash==="landing" || hash==="login")){ navigate("dashboard"); return; }

  const app = document.getElementById("app");

  if(hash==="landing") { app.innerHTML = viewLanding(); bindLanding(); return; }
  if(hash==="login") { app.innerHTML = viewLogin(); bindLogin(); return; }
  if(hash==="dashboard") { app.innerHTML = viewDashboardLoading(); await loadReminders(); app.innerHTML = viewDashboard(); bindDashboard(); return; }
  if(hash==="nuevo") {
    await asegurarPerfilCargado();
    STATE.editId = null;
    STATE.formTempTipo = "cita_medica";
    STATE.formDraft = {
      titulo: "",
      fecha: "",
      hora: "",
      centro_medico: "",
      especialidad: "",
      medico: "",
      direccion: "",
      ubicacion: "",
      notas: "",
      anticipaciones: [{tipo: 'preset', valor: 24}],
      productos: [""],
      destinatarios: contactosWhatsApp().filter(c=>c.activo).map(c=>c.id),
      avisar_whatsapp: true,
      compra_modo: "ahora"
    };
    app.innerHTML = viewForm();
    bindForm();
    return;
  }
  if(hash.startsWith("editar/")) {
    await asegurarPerfilCargado();
    const id = hash.split("/")[1];
    await loadReminders();
    const r = STATE.reminders.find(x=>x.id===id);
    if(r){
      STATE.editId = id;
      STATE.formTempTipo = r.tipo === "compra" ? "compra" : (r.tipo || "cita_medica");
      const esCompra = r.tipo === "compra";
      STATE.formDraft = {
        titulo: r.titulo || "",
        fecha: r.fecha || "",
        hora: r.hora || "",
        centro_medico: r.centro_medico || "",
        especialidad: r.especialidad || "",
        medico: r.medico || "",
        direccion: r.direccion || "",
        ubicacion: r.ubicacion || "",
        notas: esCompra ? "" : (r.notas || ""),
        anticipaciones: parseAnticipaciones(r.anticipacion_horas),
        productos: esCompra ? (r.notas || "").split("\n").map(x=>x.trim()).filter(Boolean) : [""],
        destinatarios: destinatariosRecordatorio(r).map(c=>c.id),
        avisar_whatsapp: r.avisar_whatsapp !== false,
        compra_modo: "programada"
      };
    }
    app.innerHTML = viewForm();
    bindForm();
    return;
  }
  if(hash==="perfil") { await bindPerfilLoad(); return; }

  navigate(STATE.user ? "dashboard" : "landing");
}

  ];
  return `
  <main class="relative">
    ${navbar(true)}
    <section class="relative overflow-hidden px-5 pb-20 pt-16 sm:pb-28 sm:pt-24">
      <div class="mx-auto max-w-4xl text-center">
        <span class="glass mb-6 inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-sm text-mint-400">🇨🇱 Recordatorios con WhatsApp vía Green.API</span>
        <h1 class="font-display text-4xl font-bold leading-[1.05] tracking-tight text-sand sm:text-6xl">
          Tu hora médica, tu evento, <span class="text-gradient">tu trámite.</span><br/>Nunca más un olvido.

function bindLogin(){
  let modo = "login";
  const $ = id => document.getElementById(id);
  function setModo(m){
    modo = m;
    $("modo-login").className = "flex-1 rounded-full py-2 font-medium transition " + (m==="login" ? "bg-mint-500 text-ink-950" : "text-sand/60");
    $("modo-registro").className = "flex-1 rounded-full py-2 font-medium transition " + (m==="registro" ? "bg-mint-500 text-ink-950" : "text-sand/60");
    $("campo-nombre").classList.toggle("hidden", m!=="registro");
    $("login-titulo").textContent = m==="login" ? "Bienvenido de vuelta" : "Crea tu cuenta gratis";
    $("login-subtitulo").textContent = m==="login" ? "Ingresa para ver tus recordatorios" : "Toma menos de un minuto";
    $("auth-submit").textContent = m==="login" ? "Iniciar sesión →" : "Crear cuenta →";
    $("auth-error").classList.add("hidden"); $("auth-aviso").classList.add("hidden");
  }
  $("modo-login").onclick = ()=>setModo("login");
  $("modo-registro").onclick = ()=>setModo("registro");

  $("auth-form").onsubmit = async (e)=>{
    e.preventDefault();
    const email = $("in-email").value.trim();
    const password = $("in-password").value;
    const nombre = $("in-nombre").value.trim();
    $("auth-error").classList.add("hidden"); $("auth-aviso").classList.add("hidden");
    $("auth-submit").disabled = true;
    $("auth-submit").textContent = "Un momento...";
    try{
      if(modo==="registro"){
        const { error } = await sb.auth.signUp({ email, password, options:{ data:{ nombre } } });
        if(error) throw error;
        $("auth-aviso").textContent = "¡Cuenta creada! Inicia sesión directamente. 🎉";
        $("auth-aviso").classList.remove("hidden");
        setModo("login");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        navigate("dashboard");
      }
    } catch(err){
      $("auth-error").textContent = "⚠️ " + (err?.message || "Error de autenticación");
      $("auth-error").classList.remove("hidden");
    } finally {
      $("auth-submit").disabled = false;
      $("auth-submit").textContent = modo==="login" ? "Iniciar sesión →" : "Crear cuenta →";
    }
  };
}

function bindDashboard(){
  document.getElementById("btn-logout").onclick = async ()=>{ await sb.auth.signOut(); STATE.perfil=null; navigate("landing"); };
  document.querySelectorAll("#filtros button").forEach(b=>{
    b.onclick = ()=>{ STATE.filtro = b.dataset.f; render(); };
  });

  document.querySelectorAll("[data-enviar-wa]").forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.enviarWa;
      const r = STATE.reminders.find(x=>x.id===id);
      if(!r) return;
      const destinatarios = destinatariosRecordatorio(r);
      if(!destinatarios.length){
        alert("No hay destinatarios configurados para este recordatorio.");
        return;
      }
      b.disabled = true;
      b.textContent = "Enviando...";
      try {
        const mensaje = construirMensaje(r);
        for(const dest of destinatarios){
          await enviarWhatsAppGreenAPI(dest.telefono, mensaje);
        }
        alert("¡Mensaje(s) enviado(s) exitosamente por Green.API! 🚀");
      } catch(err){
        alert("⚠️ Error al enviar WhatsApp con Green.API: " + (err.message || err));
      } finally {
        b.disabled = false;
        b.textContent = "📲 Enviar WhatsApp";
      }
    };
  });

  document.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm("¿Seguro que quieres eliminar este recordatorio?")) return;
      await sb.from("reminders").delete().eq("id", b.dataset.del);
      await loadReminders();
      document.getElementById("app").innerHTML = viewDashboard();
      bindDashboard();
    };
  });
}

          <div id="campo-telefono" class="space-y-2">

            ${contactosDisponibles.length ? contactosDisponibles.map(c=>`<label class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-200 bg-white p-3"><input type="checkbox" class="f-destinatario accent-mint-500" value="${esc(c.id)}" ${d.destinatarios.includes(c.id)?'checked':''} /><span class="min-w-0"><span class="block font-medium text-sand">${esc(c.nombre)}</span><span class="block text-xs text-sand/50">${esc(c.telefono)}</span></span></label>`).join("") : `<div class="rounded-xl border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800">No tienes números activos. Agrégalos en tu perfil.</div>`}
            <a href="#perfil" class="btn-ghost !px-0 !py-1 text-sm">⚙️ Administrar números</a>
          </div>
        </section>

        <div id="form-error" class="hidden rounded-xl bg-coral-500/10 px-4 py-3 text-sm text-coral-400"></div>

function sincronizarDraftFormulario(){
  const d = STATE.formDraft;
  const fTitulo = document.getElementById("f-titulo");
  const fFecha = document.getElementById("f-fecha");
  const fHora = document.getElementById("f-hora");
  const fCentro = document.getElementById("f-centro-manual");
  const fEsp = document.getElementById("f-especialidad");
  const fEspMan = document.getElementById("f-especialidad-manual");
  const fMed = document.getElementById("f-medico");
  const fDir = document.getElementById("f-direccion");
  const fUbi = document.getElementById("f-ubicacion");
  const fNotas = document.getElementById("f-notas");
  const fAvisarWa = document.getElementById("f-avisar-whatsapp");

  if(fTitulo) d.titulo = fTitulo.value;
  if(fFecha) d.fecha = fFecha.value;
  if(fHora) d.hora = fHora.value;
  if(fCentro) d.centro_medico = fCentro.value;
  if(fEsp){
    d.especialidad = fEsp.value === "otra" ? (fEspMan ? fEspMan.value : "") : fEsp.value;
  }
  if(fMed) d.medico = fMed.value;
  if(fDir) d.direccion = fDir.value;
  if(fUbi) d.ubicacion = fUbi.value;
  if(fNotas) d.notas = fNotas.value;
  if(fAvisarWa) d.avisar_whatsapp = fAvisarWa.checked;

  d.productos = [...document.querySelectorAll(".f-producto")].map(x=>x.value).filter(Boolean);
  if(d.productos.length === 0) d.productos = [""];
  d.destinatarios = [...document.querySelectorAll(".f-destinatario:checked")].map(x=>x.value);
}

function bindForm(){
  const $ = id => document.getElementById(id);
  const normalizarTexto = valor => String(valor || "").split("\n").map(linea=>{
    const limpio=linea.trim().replace(/\s+/g," ");
    if(!limpio) return "";
    return limpio.charAt(0).toLocaleUpperCase("es-CL")+limpio.slice(1).toLocaleLowerCase("es-CL");
  }).join("\n");

  function actualizarTipoForm(){
    const tipo = STATE.formTempTipo;
    const config = FORM_CONFIG[tipo] || FORM_CONFIG.otro;
    const esCita = tipo === "cita_medica";
    const esCompra = tipo === "compra";
    $("bloque-titulo").classList.toggle("hidden", esCita || esCompra);
    $("bloque-cita").classList.toggle("hidden", !esCita);
    $("bloque-compra").classList.toggle("hidden", !esCompra);
    $("bloque-ubicacion").classList.toggle("hidden", esCita || esCompra);
    $("bloque-notas").classList.toggle("hidden", esCompra);
    $("label-titulo").textContent = config.titulo;
    $("f-titulo").placeholder = config.placeholder;
  }

  function prepararFilaProducto(fila){
    const campo = fila.querySelector(".f-producto");
    campo.onblur = () => { campo.value = normalizarTexto(campo.value); sincronizarDraftFormulario(); };
    campo.oninput = sincronizarDraftFormulario;
    const boton = fila.querySelector(".btn-eliminar-producto");
    if(boton) boton.onclick = () => {
      const filas = document.querySelectorAll("#lista-compra-items .compra-item");
      if(filas.length === 1){ fila.querySelector(".f-producto").value = ""; } else { fila.remove(); }
      sincronizarDraftFormulario();
    };
  }

  function agregarProducto(){
    const fila = document.createElement("div");
    fila.className = "compra-item flex items-center gap-2";
    fila.innerHTML = '<input class="input-field f-producto" placeholder="Ej: Pan" /><button type="button" class="btn-eliminar-producto btn-ghost !px-3 !py-2 text-lg">×</button>';
    $("lista-compra-items").appendChild(fila);
    prepararFilaProducto(fila);
    sincronizarDraftFormulario();
  }

  document.querySelectorAll("#lista-compra-items .compra-item").forEach(prepararFilaProducto);
  if($("btn-agregar-producto")) $("btn-agregar-producto").onclick = agregarProducto;

  document.querySelectorAll("#tipo-chips button").forEach(b=>{
    b.onclick = () => {
      sincronizarDraftFormulario();
      STATE.formTempTipo = b.dataset.tipo;
      document.querySelectorAll("#tipo-chips button").forEach(x=>x.className="chip"+(x===b?" chip-active":""));
      actualizarTipoForm();
    };
  });

  document.querySelectorAll("#compra-modo-chips button").forEach(b=>{
    b.onclick = () => {
      STATE.formDraft.compra_modo = b.dataset.compraModo;
      document.querySelectorAll("#compra-modo-chips button").forEach(x=>x.className="chip"+(x===b?" chip-active":""));
    };
  });

  function sincronizarAnticipacionesForm(){
    const nuevas = [];
    document.querySelectorAll("#anticipacion-presets button").forEach(b => {
      if(b.classList.contains("chip-active")){
        nuevas.push({ tipo: 'preset', valor: Number(b.dataset.preset) });
      }
    });
    document.querySelectorAll(".anticipacion-custom-row").forEach(row => {
      const fecha = row.querySelector(".f-custom-fecha")?.value || "";
      const hora = row.querySelector(".f-custom-hora")?.value || "";
      nuevas.push({ tipo: 'custom', fecha, hora });
    });
    STATE.formDraft.anticipaciones = nuevas;
  }

  document.querySelectorAll("#anticipacion-presets button").forEach(b => {
    b.onclick = () => {
      b.classList.toggle("chip-active");
      sincronizarAnticipacionesForm();
    };
  });

  function renderAnticipacionCustomList(){
    const customItems = STATE.formDraft.anticipaciones.filter(x => x.tipo === 'custom');
    const container = $("lista-anticipacion-custom");
    if(!container) return;

    if(customItems.length === 0){
      container.innerHTML = `<p class="text-xs text-sand/40 italic">No hay recordatorios personalizados agregados.</p>`;
      return;
    }

    container.innerHTML = customItems.map((custom, idx) => `
      <div class="anticipacion-custom-row rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-3" data-index="${idx}">
        <div class="flex items-center justify-between">
          <span class="font-display text-xs font-semibold text-sand">Personalizado #${idx+1}</span>
          <button type="button" class="btn-ghost btn-eliminar-anticipacion-custom !px-0 !py-1 text-coral-400 text-xs">Eliminar</button>
        </div>
        <div class="form-grid-2">
          <div>
            <label class="label-field text-xs">Fecha</label>
            <input type="date" class="input-field f-custom-fecha" value="${esc(custom.fecha)}" />
          </div>
          <div>
            <label class="label-field text-xs">Hora</label>
            <input type="time" class="input-field f-custom-hora" value="${esc(custom.hora)}" />
          </div>
        </div>
      </div>
    `).join("");

    container.querySelectorAll(".anticipacion-custom-row").forEach(row => {
      row.querySelector(".btn-eliminar-anticipacion-custom").onclick = () => {
        const idx = Number(row.dataset.index);
        let customs = STATE.formDraft.anticipaciones.filter(x => x.tipo === 'custom');
        customs.splice(idx, 1);
        const presets = STATE.formDraft.anticipaciones.filter(x => x.tipo === 'preset');
        STATE.formDraft.anticipaciones = [...presets, ...customs];
        renderAnticipacionCustomList();
      };
      row.querySelectorAll("input").forEach(inp => {
        inp.oninput = sincronizarAnticipacionesForm;
        inp.onchange = sincronizarAnticipacionesForm;
      });
    });
  }

  const btnAgregarCustom = $("btn-agregar-anticipacion-custom");
  if(btnAgregarCustom){
    btnAgregarCustom.onclick = () => {
      sincronizarAnticipacionesForm();
      STATE.formDraft.anticipaciones.push({ tipo: 'custom', fecha: "", hora: "" });
      renderAnticipacionCustomList();
    };
  }

  document.querySelectorAll(".anticipacion-custom-row").forEach(row => {
    row.querySelector(".btn-eliminar-anticipacion-custom").onclick = () => {
      row.remove();
      sincronizarAnticipacionesForm();
      renderAnticipacionCustomList();
    };
    row.querySelectorAll("input").forEach(inp => {
      inp.oninput = sincronizarAnticipacionesForm;
      inp.onchange = sincronizarAnticipacionesForm;
    });
  });

  if($("f-especialidad")) {
    $("f-especialidad").onchange = () => {
      $("bloque-otra-especialidad").classList.toggle("hidden", $("f-especialidad").value!=="otra");
      sincronizarDraftFormulario();
    };
  }

  document.querySelectorAll("#reminder-form input, #reminder-form textarea, #reminder-form select").forEach(el=>{
    el.oninput = sincronizarDraftFormulario;
    el.onchange = sincronizarDraftFormulario;
  });

  actualizarTipoForm();

  $("reminder-form").onsubmit = async (e) => {
    e.preventDefault();
    sincronizarDraftFormulario();
    sincronizarAnticipacionesForm();
    $("form-error").classList.add("hidden");
    const mostrarError = msg => { $("form-error").textContent = "⚠️ " + msg; $("form-error").classList.remove("hidden"); };

    if(!STATE.user){
      const { data } = await sb.auth.getSession();
      STATE.user = data.session?.user || null;
    }
    if(!STATE.user){ mostrarError("Sesión expirada."); return; }

    const tipo = STATE.formTempTipo;
    const esCompra = tipo === "compra";
    const esCita = tipo === "cita_medica";
    let fecha = STATE.formDraft.fecha;
    let hora = STATE.formDraft.hora;

    if(esCompra && STATE.formDraft.compra_modo === "ahora"){
      const ahora = new Date();
      fecha = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,"0")}-${String(ahora.getDate()).padStart(2,"0")}`;
      hora = `${String(ahora.getHours()).padStart(2,"0")}:${String(ahora.getMinutes()).padStart(2,"0")}`;
    }

    const especialidad = normalizarTexto(STATE.formDraft.especialidad);
    const centro = normalizarTexto(STATE.formDraft.centro_medico);
    const listaCompra = STATE.formDraft.productos.filter(Boolean).join("\n");
    let titulo = esCita ? (especialidad ? `Cita médica · ${especialidad}` : "Cita médica") : (esCompra ? "🛒 Lista de compras" : normalizarTexto(STATE.formDraft.titulo));

    if(!fecha || !hora){ mostrarError("Completa la fecha y hora."); return; }
    if(!esCita && !esCompra && !titulo){ mostrarError("Escribe un título."); return; }
    if(esCita && (!centro || !especialidad)){ mostrarError("Completa el centro médico y especialidad."); return; }
    if(esCompra && !listaCompra){ mostrarError("Agrega al menos un producto."); return; }

    if(!STATE.formDraft.anticipaciones || STATE.formDraft.anticipaciones.length === 0){
      mostrarError("Selecciona al menos una opción de anticipación o recordatorio.");
      return;
    }
    for(const item of STATE.formDraft.anticipaciones){
      if(item.tipo === 'custom' && (!item.fecha || !item.hora)){
        mostrarError("Completa la fecha y hora para todos los recordatorios personalizados.");
        return;
      }
    }

    const destinatarios = STATE.formDraft.destinatarios;
    if(!destinatarios.length){ mostrarError("Selecciona al menos un número de WhatsApp."); return; }

    let notas = normalizarTexto(STATE.formDraft.notas) || null;
    if(esCompra) notas = listaCompra;

    const payload = {
      user_id: STATE.user.id,
      tipo: esCompra ? "otro" : tipo,
      titulo, fecha, hora,
      centro_medico: esCita ? centro : null,
      region: null,
      especialidad: esCita ? especialidad : null,
      medico: esCita ? normalizarTexto(STATE.formDraft.medico) : null,
      direccion: esCita ? normalizarTexto(STATE.formDraft.direccion) : null,
      ubicacion: (!esCita && !esCompra) ? normalizarTexto(STATE.formDraft.ubicacion) : null,
      notas,
      avisar_email: false,
      avisar_whatsapp: STATE.formDraft.avisar_whatsapp,
      telefono_whatsapp: JSON.stringify(destinatarios),
      anticipacion_horas: JSON.stringify(STATE.formDraft.anticipaciones),
      notificado: false
    };

    $("form-submit").disabled = true;
    $("form-submit").textContent = "Guardando...";
    try {
      const consulta = STATE.editId ? sb.from("reminders").update(payload).eq("id", STATE.editId) : sb.from("reminders").insert(payload).select();
      const { data, error } = await consulta;
      if(error) throw error;

      if(esCompra && STATE.formDraft.compra_modo === "ahora"){
        const contactosObj = contactosWhatsApp(STATE.perfil).filter(c=>destinatarios.includes(c.id));
        const recordatorioCreado = data?.[0] || payload;
        const mensaje = construirMensaje(recordatorioCreado);
        for(const dest of contactosObj){
          await enviarWhatsAppGreenAPI(dest.telefono, mensaje);
        }
      }

      navigate("dashboard");
    } catch(err){
      mostrarError(err?.message || "No se pudo guardar.");
    } finally {
      $("form-submit").disabled = false;
      $("form-submit").textContent = STATE.editId ? "Guardar cambios ✅" : "Crear recordatorio 🔔";
    }
  };
}

  const perfil = STATE.perfil || {};
  const nombre = perfil.nombre || STATE.user?.user_metadata?.nombre || "";
  const contactos = contactosWhatsApp(perfil);
  return `
  <main class="min-h-screen pb-24 sm:pb-10">
    ${navbar(false)}
    <div class="mx-auto max-w-3xl px-5 py-8">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h1 class="font-display text-2xl font-bold text-sand">Mi perfil y WhatsApp</h1>
          <p class="text-sm text-sand/50">Configura tus números para Green.API</p>
        </div>
        <a href="#dashboard" class="btn-secondary text-sm">← Volver</a>
      </div>
      <div class="card p-6 sm:p-8 space-y-6">
        <form id="perfil-form" class="space-y-6">
          <div>
            <label class="label-field">Tu nombre</label>
            <input id="p-nombre" class="input-field" value="${esc(nombre)}" placeholder="Ej: Juan Pérez" required />
          </div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="label-field mb-0">Números de WhatsApp (Destinatarios)</label>
              <button type="button" id="btn-agregar-contacto" class="btn-secondary !px-3 !py-1.5 text-xs">＋ Agregar número</button>
            </div>
            <div id="lista-contactos" class="space-y-4">
              ${contactos.length ? contactos.map(filaContactoHTML).join("") : filaContactoHTML({id:"1", nombre:"Mi WhatsApp", telefono:"", activo:true})}
            </div>
          </div>
          <div id="perfil-error" class="hidden rounded-xl bg-coral-500/10 px-4 py-3 text-sm text-coral-400"></div>
          <div id="perfil-success" class="hidden rounded-xl bg-mint-500/10 px-4 py-3 text-sm text-mint-400">¡Perfil guardado! ✨</div>
          <button type="submit" id="perfil-submit" class="btn-primary w-full">Guardar cambios</button>
        </form>
      </div>
    </div>
    ${bottomNav("perfil")}
  </main>`;
}

function filaContactoHTML(c){
  return `
    <div class="contacto-row rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-3" data-id="${esc(c.id)}">
      <div class="flex items-center justify-between gap-3">
        <p class="font-display text-sm font-semibold text-sand">Destinatario</p>
        <label class="flex items-center gap-2 text-sm text-sand/60 cursor-pointer">
          <input type="checkbox" class="p-contacto-activo accent-mint-500" ${c.activo !== false ? 'checked' : ''}/> Activo
        </label>
      </div>
      <div class="form-grid-2">
        <div>
          <label class="label-field text-xs">Nombre</label>
          <input class="input-field p-contacto-nombre" placeholder="Ej: Yo" value="${esc(c.nombre)}" />
        </div>
        <div>
          <label class="label-field text-xs">WhatsApp (con código de país)</label>
          <input class="input-field p-contacto-telefono" placeholder="Ej: +56912345678" value="${esc(c.telefono)}" />
        </div>
      </div>
      <button type="button" class="btn-ghost btn-eliminar-contacto !px-0 !py-1 text-coral-400 text-xs">Eliminar</button>
    </div>`;
}

async function bindPerfilLoad(){
  await asegurarPerfilCargado();
  const app = document.getElementById("app");
  app.innerHTML = viewPerfil();
  
  const $ = id => document.getElementById(id);
  const listaContactos = $("lista-contactos");
  
  function prepararFila(fila){
    const delBtn = fila.querySelector(".btn-eliminar-contacto");
    delBtn.onclick = () => {
      const filas = listaContactos.querySelectorAll(".contacto-row");
      if(filas.length === 1){
        fila.querySelector(".p-contacto-nombre").value = "";
        fila.querySelector(".p-contacto-telefono").value = "";
      } else {
        fila.remove();
      }
    };
  }
  
  listaContactos.querySelectorAll(".contacto-row").forEach(prepararFila);
  
  $("btn-agregar-contacto").onclick = () => {
    const nuevo = { id: `contacto-${Date.now()}-${Math.random().toString(16).slice(2)}`, nombre: "", telefono: "", activo: true };
    const div = document.createElement("div");
    div.innerHTML = filaContactoHTML(nuevo);
    const elem = div.firstElementChild;
    listaContactos.appendChild(elem);
    prepararFila(elem);
  };
  
  $("perfil-form").onsubmit = async (e) => {
    e.preventDefault();
    $("perfil-error").classList.add("hidden");
    $("perfil-success").classList.add("hidden");
    $("perfil-submit").disabled = true;
    $("perfil-submit").textContent = "Guardando...";
    
    try {
      const nombre = normalizarTextoPresentacion($("p-nombre").value.trim());
      const filas = listaContactos.querySelectorAll(".contacto-row");
      const contactosArray = [];
      
      filas.forEach(fila => {
        const id = fila.dataset.id;
        const nombreC = normalizarTextoPresentacion(fila.querySelector(".p-contacto-nombre").value.trim());
        const telC = normalizarTelefono(fila.querySelector(".p-contacto-telefono").value.trim());
        const activo = fila.querySelector(".p-contacto-activo").checked;
        if(telC){
          contactosArray.push({ id, nombre: nombreC || "WhatsApp", telefono: telC, activo });
        }
      });
      
      const payload = {
        id: STATE.user.id,
        nombre,
        telefono_whatsapp: JSON.stringify(contactosArray),
        updated_at: new Date().toISOString()
      };
      
      const { error } = await sb.from("profiles").upsert(payload);
      if(error) throw error;
      
      STATE.perfil = { nombre, telefono_whatsapp: JSON.stringify(contactosArray) };
      $("perfil-success").classList.remove("hidden");
      setTimeout(() => navigate("dashboard"), 1200);
    } catch(err){
      $("perfil-error").textContent = "⚠️ " + (err.message || "Error al guardar perfil");
      $("perfil-error").classList.remove("hidden");
    } finally {
      $("perfil-submit").disabled = false;
      $("perfil-submit").textContent = "Guardar cambios";
    }
  };
}
</script>
