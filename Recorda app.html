function normalizarTelefono(telefono){
  let limpio = (telefono||"").replace(/[^\d+]/g,"");
  if(limpio.startsWith("+")) limpio = limpio.slice(1);
  if(limpio.startsWith("56")) return limpio;
  if(limpio.startsWith("9") && limpio.length===9) return "56"+limpio;
  return limpio;
}
function formatearFechaLarga(fecha){
  const [y,m,d] = fecha.split("-").map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function formatearHora(hora){
  const [h,m] = hora.split(":").map(Number);
  const dt = new Date(); dt.setHours(h,m);
  return dt.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
}
function construirMensaje(r){
  const emoji = TIPO_LABELS[r.tipo].emoji;
  const linea = "▬▬▬▬▬▬▬▬▬▬▬▬▬▬";
  const partes = [`${emoji} *${r.titulo}*`, linea,
    `🗓️ *Fecha:* ${formatearFechaLarga(r.fecha)}`,
    `🕒 *Hora:* ${formatearHora(r.hora)} hrs`];
  if(r.tipo==="cita_medica"){
    if(r.centro_medico) partes.push(`🏥 *Centro:* ${r.centro_medico}`);
    if(r.especialidad) partes.push(`🩺 *Especialidad:* ${r.especialidad}`);
    if(r.medico) partes.push(`👨‍⚕️ *Profesional:* ${r.medico}`);
    if(r.numero_ficha) partes.push(`🔖 *N° de ficha/orden:* ${r.numero_ficha}`);
    if(r.direccion) partes.push(`📍 *Dirección:* ${r.direccion}`);
  } else if(r.ubicacion){ partes.push(`📍 *Lugar:* ${r.ubicacion}`); }
  if(r.notas){ partes.push(linea); partes.push(`📝 *Notas:* ${r.notas}`); }
  partes.push(linea, `Enviado por *Recorda* 🔔 — no lo olvides ✅`);
  return partes.join("\n");
}
function linkWhatsApp(r){
  const mensaje = encodeURIComponent(construirMensaje(r));
  const telefono = r.telefono_whatsapp ? normalizarTelefono(r.telefono_whatsapp) : "";
  return `https://wa.me/${telefono}?text=${mensaje}`;
}
function diasRestantes(fecha,hora){
  const objetivo = new Date(`${fecha}T${hora}`);
  const diffMs = objetivo.getTime() - Date.now();
  const diffHoras = diffMs/1000/60/60;
  if(diffMs<0) return {texto:"Ya pasó",urgente:false,pasado:true};
  if(diffHoras<1) return {texto:"¡Es en menos de 1 hora!",urgente:true,pasado:false};
  if(diffHoras<24) return {texto:`En ${Math.round(diffHoras)} horas`,urgente:true,pasado:false};
  const dias = Math.round(diffHoras/24);
  return {texto:`En ${dias} día${dias===1?"":"s"}`,urgente:dias<=2,pasado:false};
}
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   5) RENDER PRINCIPAL
   ============================================================ */
async function render(){
  const hash = window.location.hash.replace("#","") || (STATE.user ? "dashboard" : "landing");

  if(!STATE.user && hash.startsWith("dashboard")){ navigate("login"); return; }
  if(STATE.user && (hash==="landing" || hash==="login")){ navigate("dashboard"); return; }

  const app = document.getElementById("app");

  if(hash==="landing") { app.innerHTML = viewLanding(); bindLanding(); return; }
  if(hash==="login") { app.innerHTML = viewLogin(); bindLogin(); return; }
  if(hash==="dashboard") { app.innerHTML = viewDashboardLoading(); await loadReminders(); app.innerHTML = viewDashboard(); bindDashboard(); return; }
  if(hash==="nuevo") { STATE.editId=null; STATE.formTempTipo="cita_medica"; STATE.formManualCentro=false; app.innerHTML = viewForm(null); bindForm(); return; }
  if(hash.startsWith("editar/")) {
    const id = hash.split("/")[1];
    await loadReminders();
    const r = STATE.reminders.find(x=>x.id===id);
    STATE.editId = id;
    STATE.formTempTipo = r?.tipo || "cita_medica";
    STATE.formManualCentro = !!r?.centro_medico && !CENTROS_MEDICOS_CHILE.some(reg=>reg.centros.some(c=>c.nombre===r.centro_medico));
    app.innerHTML = viewForm(r);
    bindForm();
    return;
  }
  if(hash==="perfil") { app.innerHTML = viewPerfilLoading(); await bindPerfilLoad(); return; }

  navigate(STATE.user ? "dashboard" : "landing");
}

function bindLogin(){
  let modo = "login";
  const $ = id => document.getElementById(id);
  function setModo(m){
    modo = m;
    $("modo-login").className = "flex-1 rounded-full py-2 font-medium transition " + (m==="login" ? "bg-mint-500 text-ink-950" : "text-sand/60");
    $("modo-registro").className = "flex-1 rounded-full py-2 font-medium transition " + (m==="registro" ? "bg-mint-500 text-ink-950" : "text-sand/60");
    $("campo-nombre").classList.toggle("hidden", m!=="registro");
    $("login-titulo").textContent = m==="login" ? "Bienvenido de vuelta" : "Crea tu cuenta gratis";
    $("login-subtitulo").textContent = m==="login" ? "Ingresa para ver tus recordatorios" : "Toma menos de un minuto";
    $("auth-submit").textContent = m==="login" ? "Iniciar sesión →" : "Crear cuenta →";
    $("auth-error").classList.add("hidden"); $("auth-aviso").classList.add("hidden");
  }
  $("modo-login").onclick = ()=>setModo("login");
  $("modo-registro").onclick = ()=>setModo("registro");

  $("auth-form").onsubmit = async (e)=>{
    e.preventDefault();
    const email = $("in-email").value.trim();
    const password = $("in-password").value;
    const nombre = $("in-nombre").value.trim();
    $("auth-error").classList.add("hidden"); $("auth-aviso").classList.add("hidden");
    $("auth-submit").disabled = true;
    $("auth-submit").textContent = "Un momento...";
    try{
      if(modo==="registro"){
        const { error } = await sb.auth.signUp({ email, password, options:{ data:{ nombre } } });
        if(error) throw error;
        $("auth-aviso").textContent = "¡Cuenta creada! Revisa tu correo si te pedimos confirmarlo, o inicia sesión directamente. 🎉";
        $("auth-aviso").classList.remove("hidden");
        setModo("login");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        navigate("dashboard");
      }
    } catch(err){
      $("auth-error").textContent = "⚠️ " + traducirError(err?.message);
      $("auth-error").classList.remove("hidden");
    } finally {
      $("auth-submit").disabled = false;
      $("auth-submit").textContent = modo==="login" ? "Iniciar sesión →" : "Crear cuenta →";
    }
  };
}
function traducirError(msg){
  if(!msg) return "Ocurrió un error. Intenta de nuevo.";
  if(msg.includes("Invalid login credentials")) return "Correo o contraseña incorrectos.";
  if(msg.includes("User already registered")) return "Ese correo ya tiene una cuenta. Intenta iniciar sesión.";
  if(msg.includes("Password should be at least")) return "La contraseña debe tener al menos 6 caracteres.";
  return msg;
}

    const sel = $("f-centro");
    const regionObj = CENTROS_MEDICOS_CHILE.find(r=>r.region===region);
    sel.innerHTML = `<option value="">${region ? "Selecciona el centro" : "Elige una región primero"}</option>` +
      (regionObj?.centros.map(c=>`<option value="${esc(c.nombre)}" ${c.nombre===seleccionado?'selected':''}>${esc(c.nombre)} — ${esc(c.comuna)}</option>`).join("") || "");
    sel.disabled = !region;
  }
  if($("f-region")) poblarCentros(existingRegion, existingCentro);

  // Tipo chips
  document.querySelectorAll("#tipo-chips button").forEach(b=>{
    b.onclick = ()=>{
      STATE.formTempTipo = b.dataset.tipo;
      document.querySelectorAll("#tipo-chips button").forEach(x=>x.className = "chip" + (x===b ? " chip-active":""));
      $("bloque-cita").classList.toggle("hidden", STATE.formTempTipo!=="cita_medica");
      $("bloque-otro").classList.toggle("hidden", STATE.formTempTipo==="cita_medica");
      $("label-titulo").textContent = STATE.formTempTipo==="cita_medica" ? "Motivo de la cita" : "Título";
    };
  });

  // Toggle manual/lista centro
  if($("btn-manual")){
    $("btn-manual").onclick = ()=>{
      STATE.formManualCentro = !STATE.formManualCentro;
      $("centro-lista").classList.toggle("hidden", STATE.formManualCentro);
      $("f-centro-manual").classList.toggle("hidden", !STATE.formManualCentro);
      $("btn-manual").textContent = STATE.formManualCentro ? "Elegir de la lista" : "Escribirlo yo mismo ✍️";
    };
    $("f-region").onchange = ()=>{ poblarCentros($("f-region").value, ""); };
  }

  // Canales
  function toggleCanal(chk, wrap, campo){
    wrap.classList.toggle("border-mint-500/60", chk.checked);
    wrap.classList.toggle("bg-mint-500/10", chk.checked);
    wrap.classList.toggle("border-white/10", !chk.checked);
    wrap.classList.toggle("bg-white/[0.02]", !chk.checked);
    campo.classList.toggle("hidden", !chk.checked);
  }
  $("f-avisar-whatsapp").onchange = ()=>toggleCanal($("f-avisar-whatsapp"), $("wrap-whatsapp"), $("campo-telefono"));
  $("f-avisar-email").onchange = ()=>toggleCanal($("f-avisar-email"), $("wrap-email"), $("campo-email"));

  // Anticipación chips
  document.querySelectorAll("#anticipacion-chips button").forEach(b=>{
    b.onclick = ()=>{
      anticipacion = Number(b.dataset.ant);
      document.querySelectorAll("#anticipacion-chips button").forEach(x=>x.className = "chip" + (Number(x.dataset.ant)===anticipacion ? " chip-active":""));
    };
  });

  $("reminder-form").onsubmit = async (e)=>{
    e.preventDefault();
    $("form-error").classList.add("hidden");

    const titulo = $("f-titulo").value.trim();
    const fecha = $("f-fecha").value;
    const hora = $("f-hora").value;
    const avisarWhatsapp = $("f-avisar-whatsapp").checked;
    const avisarEmail = $("f-avisar-email").checked;
    const telefono = $("f-telefono")?.value.trim() || "";
    const email = $("f-email")?.value.trim() || "";

    if(!titulo || !fecha || !hora){ mostrarError("Completa al menos el título, la fecha y la hora."); return; }
    if(avisarWhatsapp && !telefono){ mostrarError("Ingresa un número de WhatsApp para poder avisarte por ahí."); return; }
    if(avisarEmail && !email){ mostrarError("Ingresa un correo para poder avisarte por email."); return; }

    function mostrarError(msg){ $("form-error").textContent = "⚠️ " + msg; $("form-error").classList.remove("hidden"); }

    $("form-submit").disabled = true;
    $("form-submit").textContent = "Guardando...";

    const centroMedico = STATE.formTempTipo==="cita_medica" ? (STATE.formManualCentro ? $("f-centro-manual").value.trim() : $("f-centro")?.value) : null;

    const payload = {
      user_id: STATE.user.id,
      tipo: STATE.formTempTipo,
      titulo, fecha, hora,
      centro_medico: STATE.formTempTipo==="cita_medica" ? (centroMedico||null) : null,
      region: STATE.formTempTipo==="cita_medica" ? ($("f-region")?.value || null) : null,
      especialidad: STATE.formTempTipo==="cita_medica" ? ($("f-especialidad")?.value || null) : null,
      medico: STATE.formTempTipo==="cita_medica" ? ($("f-medico")?.value || null) : null,
      numero_ficha: STATE.formTempTipo==="cita_medica" ? ($("f-ficha")?.value || null) : null,
      direccion: STATE.formTempTipo==="cita_medica" ? ($("f-direccion")?.value || null) : null,
      ubicacion: STATE.formTempTipo!=="cita_medica" ? ($("f-ubicacion")?.value || null) : null,
      notas: $("f-notas").value || null,
      avisar_email: avisarEmail,
      avisar_whatsapp: avisarWhatsapp,
      email_aviso: avisarEmail ? email : null,
      telefono_whatsapp: avisarWhatsapp ? telefono : null,
      anticipacion_horas: anticipacion
    };

    try{
      if(STATE.editId){
        const { error } = await sb.from("reminders").update(payload).eq("id", STATE.editId);
        if(error) throw error;
      } else {
        const { error } = await sb.from("reminders").insert(payload);
        if(error) throw error;
      }
      if(avisarWhatsapp && telefono){
        await sb.from("profiles").update({ telefono_whatsapp: telefono }).eq("id", STATE.user.id);
      }
      navigate("dashboard");
    } catch(err){
      mostrarError(err?.message || "No se pudo guardar el recordatorio.");
    } finally {
      $("form-submit").disabled = false;
      $("form-submit").textContent = STATE.editId ? "Guardar cambios ✅" : "Crear recordatorio 🔔";
    }
  };
}

/* ============================================================
   11) PERFIL
   ============================================================ */
function viewPerfilLoading(){
  return `<main class="min-h-screen pb-24 sm:pb-10">${navbar(false)}<div class="py-24 text-center text-sand/40">Cargando…</div></main>`;
}
async function bindPerfilLoad(){
  const { data: perfil } = await sb.from("profiles").select("nombre, telefono_whatsapp").eq("id", STATE.user.id).maybeSingle();
  const app = document.getElementById("app");
  app.innerHTML = `
  <main class="min-h-screen pb-24 sm:pb-10">
    <header class="sticky top-0 z-30 border-b border-white/5 bg-ink-900/80 backdrop-blur-xl">
      <div class="mx-auto flex max-w-2xl items-center gap-3 px-5 py-4">
        <a href="#dashboard" class="btn-ghost !px-2 !py-2">←</a>
        <p class="font-display text-sm font-semibold text-sand">Tu perfil 👤</p>
      </div>
    </header>
    <div class="mx-auto max-w-2xl px-5 py-8">
      <div class="card p-6 sm:p-8">
        <p class="text-xs text-sand/40">Correo de la cuenta</p>
        <p class="mt-1 font-display text-lg text-sand">${esc(STATE.user.email)}</p>
        <form id="perfil-form" class="mt-6 space-y-4">
          <div><label class="label-field">Nombre</label><input id="p-nombre" class="input-field" value="${esc(perfil?.nombre)}" /></div>
          <div>
            <label class="label-field">Número de WhatsApp por defecto</label>
            <input id="p-telefono" class="input-field" placeholder="Ej: +56 9 1234 5678" value="${esc(perfil?.telefono_whatsapp)}" />
            <p class="mt-1 text-xs text-sand/40">Se usará como valor por defecto al crear nuevos recordatorios.</p>
          </div>
          <div id="perfil-aviso" class="hidden rounded-xl bg-mint-500/10 px-4 py-3 text-sm text-mint-400"></div>
          <button type="submit" id="perfil-submit" class="btn-primary w-full">Guardar cambios</button>
        </form>
      </div>
      <button id="perfil-logout" class="btn-secondary mt-6 w-full text-coral-400">Cerrar sesión</button>
    </div>
    ${bottomNav("perfil")}
  </main>`;

  document.getElementById("perfil-form").onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById("perfil-submit");
    btn.disabled = true; btn.textContent = "Guardando...";
    await sb.from("profiles").update({
      nombre: document.getElementById("p-nombre").value,
      telefono_whatsapp: document.getElementById("p-telefono").value
    }).eq("id", STATE.user.id);
    const aviso = document.getElementById("perfil-aviso");
    aviso.textContent = "Datos guardados ✅"; aviso.classList.remove("hidden");
    btn.disabled = false; btn.textContent = "Guardar cambios";
  };
  document.getElementById("perfil-logout").onclick = async ()=>{ await sb.auth.signOut(); navigate("landing"); };
}
</script>
